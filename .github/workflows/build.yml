name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/AudioControlApp/AudioControlApp.csproj -c Release --nologo

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/AudioControlApp/AudioControlApp.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:DebugType=none
          -o artifacts/framework-dependent

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/AudioControlApp/AudioControlApp.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o artifacts/self-contained

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/framework-dependent/* -DestinationPath AudioControlApp-win-x64.zip
          Compress-Archive -Path artifacts/self-contained/* -DestinationPath AudioControlApp-win-x64-selfcontained.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AudioControlApp
          path: |
            AudioControlApp-win-x64.zip
            AudioControlApp-win-x64-selfcontained.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioControlApp-win-x64.zip
            AudioControlApp-win-x64-selfcontained.zip
